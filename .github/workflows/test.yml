name: tests
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test-ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "awsm-renderer"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all --all-features --tests -- -D warnings

      - name: cargo test
        run: cargo test --all-features

      # Consumers may turn the renderer's default features off (e.g. a lean
      # app without animation or LOD): every combination must still build.
      - name: feature combinations (awsm-renderer)
        run: |
          set -e
          for f in "" animation lod animation,lod; do
            echo "::group::--no-default-features --features '$f'"
            cargo check -p awsm-renderer --target wasm32-unknown-unknown --no-default-features ${f:+--features $f}
            echo "::endgroup::"
          done
